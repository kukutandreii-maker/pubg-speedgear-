name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create APK Package Structure
      run: |
        mkdir -p build-output
        echo "PUBG SpeedGear Build Container" > build-output/pubg-speedgear.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pubg-speedgear-apk
        path: build-output/*.apk

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG SpeedGear</title>
    <style>
        :root {
            --accent-color: #00f2fe;
            --bg-opacity: 0.15;
            --card-bg: rgba(20, 20, 30, var(--bg-opacity));
            --border-color: rgba(0, 242, 254, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #1a1c29 0%, #0b0f19 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-color), #4facfe);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--accent-color);
            font-size: 22px;
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            font-size: 11px;
            color: #8f9bb3;
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            backdrop-filter: blur(10px);
        }

        .master-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(15px);
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .master-toggle-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1f2430, #131722);
            border: 3px solid var(--accent-color);
            color: var(--accent-color);
            font-size: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.3);
            transition: all 0.3s ease;
        }

        .master-toggle-btn.active {
            background: var(--accent-color);
            color: #0b0f19;
            box-shadow: 0 0 40px var(--accent-color);
        }

        .master-status {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .master-sub {
            font-size: 12px;
            color: #8f9bb3;
        }

        .grid-modules {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .module-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .module-title {
            font-size: 13px;
            font-weight: 600;
        }

        .module-icon {
            font-size: 18px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #0b0f19;
        }

        .telemetry-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .telemetry-row:last-child {
            margin-bottom: 0;
        }

        .telemetry-val {
            font-weight: 600;
            color: var(--accent-color);
        }

        .launch-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-color), #2575fc);
            border: none;
            border-radius: 16px;
            padding: 16px;
            color: #0b0f19;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Модальное окно настроек */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #131722;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .setting-group {
            margin-bottom: 16px;
        }

        .setting-label {
            font-size: 12px;
            color: #8f9bb3;
            margin-bottom: 8px;
            display: block;
        }

        .color-pickers {
            display: flex;
            gap: 10px;
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-dot.active {
            border-color: #fff;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        .close-modal {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">🚀</div>
            <div class="logo-text">
                <h1>PUBG SpeedGear</h1>
                <p>Engineered for Victory</p>
            </div>
        </div>
        <div class="settings-btn" id="openSettings">⚙️</div>
    </header>

    <div class="master-card">
        <div class="master-toggle-btn" id="masterBtn">⚡</div>
        <div class="master-status" id="masterStatus">Ускорение выключено</div>
        <div class="master-sub" id="masterSub">Нажми для запуска всех систем</div>
    </div>

    <div class="grid-modules">
        <div class="module-card">
            <div class="module-header">
                <span class="module-title">RAM Clean</span>
                <span class="module-icon">🧠</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="modRam">
                <span class="slider"></span>
            </label>
        </div>
        <div class="module-card">
            <div class="module-header">
                <span class="module-title">VPN Shield</span>
                <span class="module-icon">🛡️</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="modVpn">
                <span class="slider"></span>
            </label>
        </div>
        <div class="module-card">
            <div class="module-header">
                <span class="module-title">Audio EQ</span>
                <span class="module-icon">🎧</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="modEq">
                <span class="slider"></span>
            </label>
        </div>
        <div class="module-card">
            <div class="module-header">
                <span class="module-title">Auto PUBG</span>
                <span class="module-icon">🎯</span>
            </div>
            <label class="switch" checked>
                <input type="checkbox" id="modAutoPubg" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="telemetry-card">
        <div class="telemetry-row">
            <span>Температура процессора:</span>
            <span class="telemetry-val" id="cpuTemp">36 °C</span>
        </div>
        <div class="telemetry-row">
            <span>Активная сессия:</span>
            <span class="telemetry-val" id="sessionTime">00:00</span>
        </div>
        <div class="telemetry-row">
            <span>Общее время в игре:</span>
            <span class="telemetry-val" id="totalTime">00:00:00</span>
        </div>
    </div>

    <button class="launch-btn" id="launchPubgBtn">
        <span>🎮</span> Запустить PUBG Mobile
    </button>

    <!-- Модальное окно кастомизации -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-title">Настройки интерфейса</div>
            
            <div class="setting-group">
                <span class="setting-label">Цветовой акцент</span>
                <div class="color-pickers">
                    <div class="color-dot" style="background: #00f2fe;" data-color="#00f2fe"></div>
                    <div class="color-dot" style="background: #00ff66;" data-color="#00ff66"></div>
                    <div class="color-dot" style="background: #ff007f;" data-color="#ff007f"></div>
                    <div class="color-dot" style="background: #ffa500;" data-color="#ffa500"></div>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Прозрачность Glassmorphism</span>
                <input type="range" id="opacityRange" min="0.05" max="0.4" step="0.05" value="0.15">
            </div>

            <button class="close-modal" id="closeSettings">Готово</button>
        </div>
    </div>

    <script>
        const masterBtn = document.getElementById('masterBtn');
        const masterStatus = document.getElementById('masterStatus');
        const masterSub = document.getElementById('masterSub');
        const modRam = document.getElementById('modRam');
        const modVpn = document.getElementById('modVpn');
        const modEq = document.getElementById('modEq');
        const modAutoPubg = document.getElementById('modAutoPubg');

        let isRunning = false;
        let sessionSeconds = 0;
        let totalSeconds = parseInt(localStorage.getItem('pubg_total_time') || '0');
        let timerInterval = null;

        function launchPubgApp() {
            // Попытка запустить PUBG (любую популярную версию пакета через intent)
            window.location.href = "intent://#Intent;package=com.tencent.ig;S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.tencent.ig;end;";
        }

        masterBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                masterBtn.classList.add('active');
                masterStatus.textContent = "Ускорение активно";
                masterSub.textContent = "RAM очищен • VPN включен • Эквалайзер запущен";
                modRam.checked = true;
                modVpn.checked = true;
                modEq.checked = true;

                // Запуск счетчиков
                startTimers();

                // Автозапуск PUBG если тумблер включен
                if (modAutoPubg.checked) {
                    setTimeout(launchPubgApp, 800);
                }
            } else {
                masterBtn.classList.remove('active');
                masterStatus.textContent = "Ускорение выключено";
                masterSub.textContent = "Нажми для запуска всех систем";
                modRam.checked = false;
                modVpn.checked = false;
                modEq.checked = false;
                stopTimers();
            }
        });

        document.getElementById('launchPubgBtn').addEventListener('click', launchPubgApp);

        function startTimers() {
            sessionSeconds = 0;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                sessionSeconds++;
                totalSeconds++;
                localStorage.setItem('pubg_total_time', totalSeconds);
                updateTimerDisplays();
            }, 1000);
        }

        function stopTimers() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function formatTime(sec, includeHours = false) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (includeHours || h > 0) {
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateTimerDisplays() {
            document.getElementById('sessionTime').textContent = formatTime(sessionSeconds, false);
            document.getElementById('totalTime').textContent = formatTime(totalSeconds, true);
        }

        // Инициализация времени
        updateTimerDisplays();

        // Имитация температуры процессора
        setInterval(() => {
            const baseTemp = isRunning ? 41 : 36;
            const fluctuation = Math.floor(Math.random() * 3);
            document.getElementById('cpuTemp').textContent = `${baseTemp + fluctuation} °C`;
        }, 3000);

        // Настройки модалки
        const modal = document.getElementById('settingsModal');
        document.getElementById('openSettings').addEventListener('click', () => modal.classList.add('open'));
        document.getElementById('closeSettings').addEventListener('click', () => modal.classList.remove('open'));

        // Кастомизация цветов и прозрачности
        const root = document.documentElement;
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', (e) => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                e.target.classList.add('active');
                const color = e.target.getAttribute('data-color');
                root.style.setProperty('--accent-color', color);
                root.style.setProperty('--border-color', color + '4d');
            });
        });

        document.getElementById('opacityRange').addEventListener('input', (e) => {
            root.style.setProperty('--bg-opacity', e.target.value);
        });
    </script>
</body>
</html>
